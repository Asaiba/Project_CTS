<!DOCTYPE html>
<html class="scroll-smooth" lang="en">
<head>
  <meta charset="utf-8"/>
  <script type="module" src="../js/authGuard.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CTS | DAO Proposals</title>
  <link rel="icon" type="image/png" href="/cts_logo.png?v=2"/>
  <link rel="apple-touch-icon" href="/cts_logo.png?v=2"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet"/>
  <script>
    tailwind.config = { darkMode: "class", theme: { extend: { colors: { primary: "#285185", secondary: "#D67940", accent: "#6F4849", "background-light": "#CCD9E2", "background-dark": "#0F172A", "surface-light": "#FFFFFF", "surface-dark": "#1E293B" }, fontFamily: { display: ["Outfit","sans-serif"], sans: ["Inter","sans-serif"] } } } };
    function applyTheme(d){document.documentElement.classList.toggle("dark",d);}
    function toggleDarkMode(){const d=!document.documentElement.classList.contains("dark");applyTheme(d);localStorage.setItem("theme",d?"dark":"light");}
    document.addEventListener("DOMContentLoaded",()=>{const s=localStorage.getItem("theme");const p=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches;applyTheme(s?s==="dark":p);});
  </script>
</head>
<body class="font-sans antialiased bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-300">
<div class="flex min-h-screen">
  <aside class="w-72 bg-surface-light dark:bg-surface-dark border-r border-slate-200 dark:border-slate-800 p-6 hidden lg:flex flex-col">
    <div class="flex items-center gap-3 mb-8">
      <div class="w-10 h-10 rounded-lg overflow-hidden bg-transparent flex items-center justify-center"><img alt="CTS Logo" class="w-10 h-10 object-contain" src="../assets/cts_logo.png"/></div>
      <span class="text-xl font-display font-bold text-primary dark:text-white"><a href="../../index.html">CTS</a> DAO</span>
    </div>
    <nav class="space-y-1 flex-1">
      <a href="dao-dashboard.html"    class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"><span class="material-icons-outlined">dashboard</span>Dashboard</a>
      <a href="dao-proposals.html"    class="flex items-center gap-3 px-4 py-3 rounded-xl bg-primary/10 text-primary dark:bg-slate-800 dark:text-white font-medium"><span class="material-icons-outlined">gavel</span>Proposals</a>
      <a href="dao-institutions.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"><span class="material-icons-outlined">school</span>Institutions</a>
      <a href="dao-history.html"      class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"><span class="material-icons-outlined">history</span>History</a>
    </nav>
    <div class="mt-6 border-t border-slate-200 dark:border-slate-800 pt-4 space-y-2">
      <button type="button" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800" onclick="toggleDarkMode()">
        <span class="material-icons-outlined dark:hidden">dark_mode</span>
        <span class="material-icons-outlined hidden dark:block">light_mode</span>
        <span>Appearance</span>
      </button>
      <a href="login.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800">
        <span class="material-icons-outlined">logout</span><span>Log Out</span>
      </a>
    </div>
  </aside>

  <main class="flex-1 p-6 lg:p-10 overflow-y-auto">
    <header class="mb-8">
      <p class="text-sm uppercase tracking-widest text-slate-500 dark:text-slate-400">Offer Review</p>
      <h1 class="text-3xl font-display font-bold mt-2">Proposals</h1>
      <p class="text-slate-600 dark:text-slate-400 mt-2">Active and pending scholarship proposals requiring DAO responses.</p>
    </header>
    <p id="dao-notice" class="text-sm mb-4 min-h-5"></p>
    <div class="bg-surface-light dark:bg-surface-dark p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
      <div class="space-y-3 text-sm" id="proposals-list">
        <div class="text-sm text-slate-500 dark:text-slate-400">Loading proposals...</div>
      </div>
    </div>
  </main>
</div>

<script type="module">
  import { formatEth, getConnectedAddress, getProposalMetadata, isDaoMemberOnChain, listDaoOffersOnChain, listProposalsOnChain, voteProposalOnChain, fundSelectedOfferOnChain } from "../js/cts-contract.js";
  import { logoutAndRedirect, refreshSessionToken, requireSession } from "../js/session.js";
  requireSession({ roles: ["dao", "admin"] });

  let isConnectedDaoMember = false;

  const formatRemaining = (ms) => {
    if (ms <= 0) return "Offer window closed";
    const m = Math.floor(ms / 60000), d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60), min = m % 60;
    if (d > 0) return `${d}d ${h}h left`; if (h > 0) return `${h}h ${min}m left`; return `${min}m left`;
  };

  const previewEssay = (essay = "", maxLength = 150) => {
    const trimmed = String(essay || "").trim();
    if (!trimmed) return "No student essay attached.";
    return trimmed.length > maxLength ? `${trimmed.slice(0, maxLength - 3)}...` : trimmed;
  };

  const renderCard = (p) => `
    <div class="rounded-xl border border-slate-200 dark:border-slate-700 p-4">
      <div class="flex flex-wrap items-center justify-between gap-2 mb-1">
        <div class="flex items-center gap-2">
          <p class="font-semibold">Proposal #${p.id}</p>
          <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-700 dark:bg-emerald-900/30 dark:text-emerald-400">Active</span>
        </div>
        <span class="text-xs text-slate-400">${formatRemaining(p.remainingMs)}</span>
      </div>
      <p class="text-slate-700 dark:text-slate-300 font-medium">${p.metaEssayPreview}</p>
      <p class="text-xs text-slate-400 mt-2">College: ${p.collegeShort} | Student: ${p.studentShort} | School Fees: ${p.amountEth} ETH</p>
      <p class="text-xs text-slate-400 mt-1">Offers: ${p.votesFor} | Passes: ${p.votesAgainst}</p>
      ${p.selectedByMe ? '<p class="text-xs text-emerald-600 dark:text-emerald-400 mt-1">Your offer was selected by the student.</p>' : ""}
      ${!isConnectedDaoMember ? '<p class="text-xs text-red-500 mt-2">Connected wallet is not an on-chain DAO member. Offer actions are disabled.</p>' : ""}
      <div class="mt-3 flex flex-wrap gap-2">
        <button type="button" data-proposal-id="${p.id}" data-choice="yes" class="dao-vote-btn px-4 py-2 rounded-lg text-xs font-bold bg-emerald-100 text-emerald-700 dark:bg-emerald-900/30 dark:text-emerald-400" ${p.canVote ? "" : "disabled"}>Submit Offer</button>
        <button type="button" data-proposal-id="${p.id}" data-choice="no"  class="dao-vote-btn px-4 py-2 rounded-lg text-xs font-bold bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400" ${p.canVote ? "" : "disabled"}>Pass</button>
        <button type="button" data-proposal-id="${p.id}" data-amount-wei="${p.selectedAmountWei || "0"}" class="dao-fund-btn px-4 py-2 rounded-lg text-xs font-bold bg-primary/10 text-primary" ${p.canFund ? "" : "disabled"}>Send Funds</button>
      </div>
      <div class="mt-3 border-t border-slate-200 dark:border-slate-700 pt-2">
        <p class="text-xs font-semibold text-slate-500 uppercase mb-1">DAO Offers</p>
        <div class="space-y-1 text-xs text-slate-500">
          ${(p.offers || []).map((o) => `<p>${o.daoShort}: ${o.amountEth} ETH ${o.isSelected ? "<span class='text-emerald-600'>(selected)</span>" : ""}</p>`).join("") || "<p>No offers yet.</p>"}
        </div>
      </div>
    </div>`;

  const load = async () => {
    const listEl = document.getElementById("proposals-list");
    const noticeEl = document.getElementById("dao-notice");
    try {
      const viewer = await getConnectedAddress();
      isConnectedDaoMember = await isDaoMemberOnChain(viewer);
      const raw = await listProposalsOnChain({ maxItems: 100, viewerAddress: viewer });
      const actionable = raw.filter((p) => !p.cancelled && !p.executed && !p.isFunded && (p.isActive || (p.hasEnded && p.votesFor > 0)));
      const enriched = await Promise.all(actionable.map(async (p) => {
        const offersRaw = await listDaoOffersOnChain(p.id);
        const offers = await Promise.all(offersRaw.map(async (o) => ({ ...o, daoShort: `${o.daoWallet.slice(0,6)}...${o.daoWallet.slice(-4)}`, amountEth: await formatEth(o.amountWei) })));
        return {
          ...p,
          metaEssayPreview: previewEssay(getProposalMetadata(p.id)?.essay || ""),
          amountEth: await formatEth(p.amountWei),
          selectedByMe: Boolean(p.selectedDao) && p.selectedDao.toLowerCase() === viewer.toLowerCase(),
          collegeShort: `${p.college.slice(0,6)}...${p.college.slice(-4)}`,
          studentShort: `${p.student.slice(0,6)}...${p.student.slice(-4)}`,
          canVote: isConnectedDaoMember && p.isActive && !p.hasVoted,
          canFund: isConnectedDaoMember && !p.executed && !p.cancelled && p.hasEnded && p.votesFor > 0 && p.selectedDao && p.selectedDao.toLowerCase() === viewer.toLowerCase() && !p.isFunded && BigInt(p.selectedAmountWei || 0n) > 0n,
          offers,
        };
      }));

      const pending = enriched.filter((p) => p.selectedByMe && !p.isFunded);
      if (noticeEl && pending.length) {
        noticeEl.textContent = `You have ${pending.length} selected offer(s) awaiting funding.`;
        noticeEl.className = "text-sm mb-4 text-amber-600 dark:text-amber-400";
      }

      listEl.innerHTML = enriched.length
        ? enriched.map(renderCard).join("")
        : '<p class="text-sm text-slate-500 dark:text-slate-400">No proposals requiring action.</p>';
    } catch {
      listEl.innerHTML = '<div class="text-sm text-red-600 dark:text-red-400">Failed to load proposals. Connect MetaMask and try again.</div>';
    }
  };

  document.getElementById("proposals-list").addEventListener("click", async (e) => {
    const voteBtn = e.target.closest(".dao-vote-btn");
    const fundBtn = e.target.closest(".dao-fund-btn");
    if (!voteBtn && !fundBtn) return;
    try {
      if (voteBtn) {
        if (!isConnectedDaoMember) throw new Error("Only on-chain DAO members can respond to proposals.");
        const proposalId = voteBtn.dataset.proposalId;
        if (voteBtn.dataset.choice === "yes") {
          const eth = (window.prompt("Enter your scholarship offer amount in ETH (must be >= school fees):") || "").trim();
          if (!eth) return;
          await voteProposalOnChain({ proposalId, support: true, offerAmountEth: eth });
        } else {
          await voteProposalOnChain({ proposalId, support: false });
        }
      } else {
        if (!isConnectedDaoMember) throw new Error("Only on-chain DAO members can send funds.");
        const proposalId = fundBtn.dataset.proposalId;
        const amountWei = fundBtn.dataset.amountWei;
        if (!amountWei || amountWei === "0") throw new Error("No selected amount found.");
        const humanAmount = await formatEth(BigInt(amountWei));
        if (!window.confirm(`Send ${humanAmount} ETH? School fees auto-forwarded to college, remainder held for student.`)) return;
        await fundSelectedOfferOnChain({ proposalId, amountWei: BigInt(amountWei) });
      }
      await load();
    } catch (err) { alert(err?.message || "Action failed."); }
  });

  load();
</script>
</body>
</html>
