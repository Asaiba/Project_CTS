<!DOCTYPE html>
<html class="scroll-smooth" lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>CTS | Reset Password</title>
  <link rel="icon" type="image/png" href="/cts_logo.png?v=2" />
  <link rel="apple-touch-icon" href="/cts_logo.png?v=2" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin href="https://fonts.gstatic.com" rel="preconnect" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#285185",
            secondary: "#D67940",
            accent: "#6F4849",
            "background-light": "#CCD9E2",
            "background-dark": "#0F172A",
          },
          fontFamily: {
            display: ["Outfit", "sans-serif"],
            sans: ["Inter", "sans-serif"],
          },
          borderRadius: {
            DEFAULT: "0.75rem",
          },
        },
      },
    };
  </script>
</head>
<body class="font-sans antialiased bg-background-light dark:bg-background-dark min-h-screen transition-colors duration-300">
  <div class="min-h-screen flex items-center justify-center px-6 py-12">
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
      <div class="absolute top-[-10%] left-[-5%] h-72 w-72 rounded-full bg-primary/20 blur-3xl"></div>
      <div class="absolute bottom-[-10%] right-[-5%] h-80 w-80 rounded-full bg-secondary/20 blur-3xl"></div>
    </div>
    <div class="relative w-full max-w-lg rounded-3xl border border-white/40 bg-white/90 p-8 shadow-2xl backdrop-blur dark:border-slate-800 dark:bg-slate-900/90">
      <a href="/index.html" class="mb-8 inline-flex items-center gap-3 text-slate-900 dark:text-white">
        <img alt="CTS Logo" class="h-10 w-10 object-contain" src="../assets/cts_logo.png" />
        <span class="text-2xl font-display font-bold">CTS</span>
      </a>

      <div class="mb-8">
        <p class="mb-3 inline-flex items-center gap-2 rounded-full bg-primary/10 px-3 py-1 text-xs font-bold uppercase tracking-[0.22em] text-primary">
          <span class="material-symbols-outlined text-sm">shield_lock</span>
          Secure Access
        </p>
        <h1 class="text-3xl font-display font-bold text-slate-900 dark:text-white" id="reset-title">Reset Your Password</h1>
        <p class="mt-3 text-sm text-slate-500 dark:text-slate-400" id="reset-subtitle">Enter a new password for your CTS account.</p>
        <p class="mt-2 text-xs font-medium uppercase tracking-[0.18em] text-slate-400" id="reset-email">Use the link from your email to continue.</p>
      </div>

      <form class="space-y-5" id="reset-password-form">
        <div>
          <label class="mb-2 block text-sm font-medium text-slate-700 dark:text-slate-300" for="new-password">New Password</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">lock</span>
            <input class="w-full rounded-xl border border-slate-200 bg-white py-3 pl-11 pr-4 text-slate-900 outline-none transition-all focus:border-primary focus:ring-2 focus:ring-primary dark:border-slate-800 dark:bg-slate-950 dark:text-white" id="new-password" type="password" placeholder="At least 8 characters" />
          </div>
        </div>

        <div>
          <label class="mb-2 block text-sm font-medium text-slate-700 dark:text-slate-300" for="confirm-password">Confirm Password</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">verified_user</span>
            <input class="w-full rounded-xl border border-slate-200 bg-white py-3 pl-11 pr-4 text-slate-900 outline-none transition-all focus:border-primary focus:ring-2 focus:ring-primary dark:border-slate-800 dark:bg-slate-950 dark:text-white" id="confirm-password" type="password" placeholder="Repeat the new password" />
          </div>
        </div>

        <button class="w-full rounded-xl bg-primary px-4 py-3.5 font-bold text-white shadow-lg shadow-primary/20 transition-all hover:-translate-y-0.5 hover:shadow-primary/30 disabled:cursor-not-allowed disabled:opacity-60" id="reset-submit-btn" type="submit">
          Save Password
        </button>

        <p class="text-sm min-h-5" id="reset-status"></p>
      </form>

      <div class="mt-8 flex items-center justify-between gap-4 text-sm text-slate-500 dark:text-slate-400">
        <a class="font-semibold text-primary hover:underline" href="/login.html">Back to login</a>
        <span>Link expires in 1 hour</span>
      </div>
    </div>
  </div>

  <script type="module" src="../js/reset-password.js"></script>
</body>
</html>
